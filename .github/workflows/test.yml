name: Run tests

on:
    workflow_dispatch:
        inputs:
            test-filter:
                description: 'Optional node --test-name-pattern to run a subset of tests'
                required: false
                default: ''

jobs:
    test:
        timeout-minutes: 30
        strategy:
            matrix:
                node: [18.x, 20.x]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v2
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v1
              with:
                  node-version: ${{ matrix.node }}
            - run: npm install
            - run: |
                  if [ -n "${{ inputs.test-filter }}" ]; then
                      node --test --test-concurrency=1 --test-name-pattern="${{ inputs.test-filter }}" test/**/*.test.js test/**/*-test.js
                  else
                      npm run test:coverage
                  fi
            - name: Pack npm tarball
              if: matrix.node == '18.x'
              run: |
                  npm i -g npm@10.8.2
                  mkdir -p seal-dist
                  npm pack --pack-destination seal-dist
            - name: Upload npm tarball
              if: matrix.node == '18.x'
              uses: actions/upload-artifact@v4
              with:
                  name: nodemailer-tgz
                  path: seal-dist/*.tgz
                  if-no-files-found: error
